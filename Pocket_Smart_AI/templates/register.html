{% extends "base.html" %}

{% block title %}
Register — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Create account
    </h1>

    <p>
        Save your recommendation history
        and use all planners.
    </p>


    <form
        method="post"
        action="/register"
    >

        <label>

            Name

            <input
                name="name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                type="email"
                name="email"
                required
            >

        </label>


        <label>

            Password

            <input
                type="password"
                name="password"
                required
                minlength="8"
            >

        </label>


        <button
            class="btn"
            type="submit"
        >
            Create account
        </button>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>

{% endblock %}
