<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    <nav>

        <a href="/">
            Home
        </a>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <form
                class="inline"
                method="post"
                action="/logout"
            >

                <button
                    class="link-btn"
                    type="submit"
                >
                    Logout
                </button>

            </form>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="btn small"
                href="/register"
            >
                Register
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    © 2026 PocketSmart AI

    ·

    Budget-aware recommendations

</footer>


<script src="/static/js/app.js"></script>

</body>

</html>
