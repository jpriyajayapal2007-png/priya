{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Welcome back
    </h1>

    <p>
        Login to access your planners
        and history.
    </p>


    <form
        method="post"
        action="/login"
    >

        <label>

            Email

            <input
                type="email"
                name="email"
                required
            >

        </label>


        <label>

            Password

            <input
                type="password"
                name="password"
                required
            >

        </label>


        <button
            class="btn"
            type="submit"
        >
            Login
        </button>

    </form>


    <p>

        New here?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>

{% endblock %}
